<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gallery</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-button (click)="takePhoto()">Take Photo</ion-button>

  <ion-list>
    <ion-item *ngFor="let photo of photos">
      <img [src]="photo.webPath" />
    </ion-item>
  </ion-list>
</ion-content>
